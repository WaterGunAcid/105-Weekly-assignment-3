<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button onclick="play(`rock`)"; class="gameButton">
            <img src="images/new rock improved.png" alt="Rock" class="gameImg">
            Rock
        </button>
        <button onclick="play(`paper`)"; class="gameButton">
            <img src="images/paper improved.png" alt="Paper" class="gameImg">
            Paper
        </button>
        <button onclick="play(`scissors`)"; class="gameButton">
            <img src="images/scissors improved.png" alt="Scissors" class="gameImg">
            Scissors
        </button>
    </div>
    <div class="result">
        <h2 id="result">Choose a move</h2>
    </div>
    <div class="result">
    <h2>SCOREBOARD:</h2>
    <h3>PLAYER: <span id="player-score">0</span></h3>
    <h3>COMPUTER: <span id="computer-score">0</span></h3>
    </div>
    <script src="home.js"></script>
</body>
</html>
